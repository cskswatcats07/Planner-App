name: CD EAS Build

on:
  push:
    branches:
      - uat
      - production
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Deployment target"
        required: true
        type: choice
        options:
          - uat
          - production

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-uat:
    name: Deploy UAT (Preview Profile)
    if: github.ref == 'refs/heads/uat' || (github.event_name == 'workflow_dispatch' && inputs.target_environment == 'uat')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: uat
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gate
        run: npm run release:check

      - name: EAS Build (iOS Preview)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli build --platform ios --profile preview --non-interactive

      - name: EAS Build (Android Preview)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli build --platform android --profile preview-android --non-interactive

  deploy-production:
    name: Deploy Production (Production Profile)
    if: github.ref == 'refs/heads/production' || (github.event_name == 'workflow_dispatch' && inputs.target_environment == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gate
        run: npm run release:check

      - name: EAS Build (iOS Production)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli build --platform ios --profile production --non-interactive

      - name: EAS Build (Android Production)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli build --platform android --profile production-android --non-interactive
